<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UnitMargin Lab | Clear E-Commerce Unit Economics & Profit Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-5 px-3 sm:px-6 font-sans">
  <div class="max-w-6xl mx-auto space-y-5">
    
    <!-- Top Nav / Control Center -->
    <header class="bg-slate-800/95 border border-slate-700 p-4 sm:p-5 rounded-2xl shadow-xl space-y-4">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 border-b border-slate-750 pb-3">
        <div>
          <div class="flex items-center gap-2.5">
            <h1 class="text-xl sm:text-2xl font-black text-white tracking-tight">UnitMargin Lab</h1>
            <span id="fxStatus" class="text-[10px] text-emerald-400 font-mono bg-emerald-950/60 border border-emerald-800 px-2 py-0.5 rounded-full font-bold">● Live FX Active</span>
          </div>
          <p id="i18n-subhead" class="text-xs text-slate-400 mt-0.5">The straightforward profit & breakeven tool for Amazon & TikTok Shop sellers.</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <!-- User Guide Button -->
          <button id="btnOpenGuide" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-slate-750 hover:bg-slate-700 text-amber-300 border border-amber-500/30 flex items-center gap-1.5 transition">
            <span>📖</span><span id="i18n-btnGuide">User Guide & Rules</span>
          </button>

          <!-- View Switcher -->
          <div class="bg-slate-900 border border-slate-700 p-1 rounded-xl flex items-center gap-1">
            <button id="btnTabSingle" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-sky-600 text-white shadow transition-all">🎯 Calculator</button>
            <button id="btnTabBatch" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-400 hover:text-white transition-all">📑 Batch Excel</button>
          </div>

          <!-- Language Switcher -->
          <select id="selLang" class="bg-slate-900 border border-slate-700 text-white text-xs font-medium rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-sky-500">
            <option value="en" selected>English</option>
            <option value="zh">中文 (简体)</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>

      <!-- Marketplace & Platform Big Switchers -->
      <div class="grid grid-cols-1 md:grid-cols-12 gap-3">
        <!-- Platform Selector -->
        <div class="md:col-span-5 bg-slate-900/90 border border-slate-750 p-2.5 rounded-xl space-y-1.5">
          <div class="flex justify-between items-center text-[11px] font-bold text-sky-400">
            <span id="i18n-step1">1. Choose Platform</span>
            <span id="txtActivePlatBadge" class="text-[10px] text-slate-400 font-mono">TikTok Shop</span>
          </div>
          <div class="grid grid-cols-2 gap-2" id="groupPlatform">
            <button type="button" data-val="TTS" class="btn-plat flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-black border transition-all bg-sky-500/20 border-sky-400 text-sky-200">
              <span>🎵</span><span>TikTok Shop</span>
            </button>
            <button type="button" data-val="AMZ" class="btn-plat flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 hover:text-white">
              <span>📦</span><span>Amazon FBA</span>
            </button>
          </div>
        </div>

        <!-- Region Selector -->
        <div class="md:col-span-7 bg-slate-900/90 border border-slate-750 p-2.5 rounded-xl space-y-1.5">
          <div class="flex justify-between items-center text-[11px] font-bold text-amber-400">
            <span id="i18n-step2">2. Choose Marketplace</span>
            <span id="fxRateDisplay" class="text-[10px] text-emerald-400 font-mono">1 USD ≈ 7.25 CNY</span>
          </div>
          <div class="grid grid-cols-3 gap-2" id="groupRegion">
            <button type="button" data-val="US" class="btn-region flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg text-xs font-black border transition-all bg-amber-500/20 border-amber-400 text-amber-200">
              <span>🇺🇸</span><span>US (USD)</span>
            </button>
            <button type="button" data-val="EU" class="btn-region flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 hover:text-white">
              <span>🇪🇺</span><span>EU (EUR)</span>
            </button>
            <button type="button" data-val="UK" class="btn-region flex items-center justify-center gap-1.5 py-2 px-2 rounded-lg text-xs font-bold border border-slate-700 bg-slate-800 text-slate-300 hover:text-white">
              <span>🇬🇧</span><span>UK (GBP)</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- WORKBENCH 1: SINGLE SKU -->
    <main id="viewSingle" class="space-y-4">
      <div class="bg-slate-800/80 border border-slate-700 px-4 py-2.5 rounded-xl flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-xs font-bold text-white" id="i18n-viewModeLabel">Calculator Mode:</span>
          <span id="badgeCurrentMode" class="text-[10px] bg-emerald-950 text-emerald-300 border border-emerald-700 px-2 py-0.5 rounded font-mono font-bold">Simple Mode (Beginner Friendly)</span>
        </div>
        <button id="btnTogglePro" class="text-xs text-sky-400 hover:text-sky-300 font-semibold underline flex items-center gap-1">
          <span id="btnToggleProText">Switch to Pro Mode (Show advanced fees) ⚙️</span>
        </button>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Input Form (7 Cols) -->
        <section class="lg:col-span-7 space-y-4">
          <!-- 3 Basic Inputs -->
          <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-5 shadow space-y-4">
            <h2 class="text-xs font-bold uppercase tracking-wider text-sky-400 flex items-center gap-1.5 border-b border-slate-700/80 pb-2">
              <span>📝</span><span id="i18n-secBasics">Basic Cost Inputs (Just 3 Numbers)</span>
            </h2>
            <div
